

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vizinhanca_app
    ports:
      # Expondo na porta 3008 por padrão para evitar conflitos (o container roda internamente na 3000)
      - "${APP_PORT:-3008}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vizinhan_user}:${POSTGRES_PASSWORD:-change_this_password}@db:5432/${POSTGRES_DB:-vizinhanca_db}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "npm run db:migrate:prod && npm run start"
    networks:
      - vizinhanca_net

  db:
    image: kartoza/postgis:15-3.4
    container_name: vizinhanca_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vizinhan_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_this_password}
      - POSTGRES_DB=${POSTGRES_DB:-vizinhanca_db}
    volumes:
      - vizinhanca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vizinhan_user} -d ${POSTGRES_DB:-vizinhanca_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - vizinhanca_net

# Isolando o aplicativo na sua própria rede Docker
networks:
  vizinhanca_net:
    name: vizinhanca_network

volumes:
  # Nome de volume específico para evitar conflito com pastas 'pgdata' de outros projetos
  vizinhanca_pgdata:
